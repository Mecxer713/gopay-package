version: 2
updates:
  - package-ecosystem: gradle
    directory: /android-sdk
    schedule:
      interval: weekly
  - package-ecosystem: pub
    directory: /flutter-sdk
    schedule:
      interval: weekly
  - package-ecosystem: composer
    directory: /php-sdk
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /javascript-sdk
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

