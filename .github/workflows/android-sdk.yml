name: Android SDK

on:
  pull_request:
    paths:
      - "android-sdk/**"
      - ".github/workflows/android-sdk.yml"
  push:
    branches: ["main"]
    paths:
      - "android-sdk/**"
      - ".github/workflows/android-sdk.yml"
    tags: ["android-v*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android-sdk
      - name: Check release tag and changelog
        if: startsWith(github.ref, 'refs/tags/android-v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#android-v}"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          grep -Fq "## ${version}" android-sdk/CHANGELOG.md
      - name: Test and export publishable artifacts
        working-directory: android-sdk
        run: bash ./gradlew --no-daemon :gopay:testReleaseUnitTest :gopay:exportAar :gopay:publishToMavenLocal
      - name: Create GitHub Release with standalone AAR
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#android-v}"
          gh release create "${GITHUB_REF_NAME}" \
            android-sdk/dist/gopay-android-*.aar \
            android-sdk/dist/gopay-android-*-sources.jar \
            --title "GoPAY Android SDK v${version}" \
            --generate-notes

