name: Android SDK

on:
  pull_request:
    paths:
      - "android-sdk/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "jitpack.yml"
      - ".github/workflows/android-sdk.yml"
  push:
    tags: ["android-v*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate mobile SDK version consistency
        run: python scripts/check_mobile_sdk_versions.py --sdk android
      - name: Check release tag and changelog
        if: startsWith(github.ref, 'refs/tags/android-v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#android-v}"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          grep -Fq "## ${version}" android-sdk/CHANGELOG.md
      - name: Test and verify publishable artifact
        run: bash ./gradlew --no-daemon :gopay:testReleaseUnitTest :gopay:publishReleasePublicationToMavenLocal
