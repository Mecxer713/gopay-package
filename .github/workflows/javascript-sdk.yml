name: JavaScript SDK

on:
  pull_request:
    paths:
      - "javascript-sdk/**"
      - ".github/workflows/javascript-sdk.yml"
  push:
    branches: ["main"]
    paths:
      - "javascript-sdk/**"
      - ".github/workflows/javascript-sdk.yml"
    tags: ["js-v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18.x", "20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: javascript-sdk/package-lock.json
      - name: Install dependencies
        working-directory: javascript-sdk
        run: npm ci
      - name: Build TypeScript
        working-directory: javascript-sdk
        run: npm run build
      - name: Run Tests
        working-directory: javascript-sdk
        run: npm test
