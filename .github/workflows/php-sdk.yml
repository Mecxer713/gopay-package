name: PHP SDK

on:
  pull_request:
    paths:
      - "php-sdk/**"
      - ".github/workflows/php-sdk.yml"
  push:
    branches: ["main"]
    paths:
      - "php-sdk/**"
      - ".github/workflows/php-sdk.yml"
    tags: ["php-v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ["8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, json, curl, openssl
          coverage: none
      - name: Install Composer dependencies
        working-directory: php-sdk
        run: composer install --prefer-dist --no-interaction
      - name: Pint Format Check
        working-directory: php-sdk
        run: composer format:test
      - name: PHPStan Analysis
        working-directory: php-sdk
        run: composer analyse
      - name: Run Tests (Pest)
        working-directory: php-sdk
        run: composer test

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/php-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag against changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#php-v}"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          grep -Eq "^## \[?${version//./\\.}\]?" php-sdk/CHANGELOG.md
      - name: Notify Packagist (if token configured)
        if: env.PACKAGIST_TOKEN != ''
        env:
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          curl -s -f -XPOST -H 'content-type:application/json' \
            "https://packagist.org/api/update-package?username=Mecxer713&apiToken=${PACKAGIST_TOKEN}" \
            -d '{"repository":{"url":"https://github.com/Mecxer713/gopay-php"}}' || true
