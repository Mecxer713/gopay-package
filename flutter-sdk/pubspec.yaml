name: gopay
description: Official GoPAY SDK for Flutter & Dart. Accept Mobile Money payments (M-Pesa, Airtel Money, Orange Money) and send payouts in DRC (CDF/USD). Cross-platform with Web and WASM support.
version: 0.2.1
homepage: https://gopay.gooomart.com
repository: https://github.com/Mecxer713/gopay-package/tree/main/flutter-sdk
issue_tracker: https://github.com/Mecxer713/gopay-package/issues
topics:
  - payment
  - mobile-money
  - fintech
  - payout
  - mpesa

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  crypto: ^3.0.6
  http: ^1.2.2

dev_dependencies:
  test: ^1.25.8
